# Demonstrates: a sequential workflow that executes two echo steps.
# Capabilities: echo
# Run: cond workflow run examples/workflow-echo.yaml
goal: "Echo two messages in sequence"
capabilities:
  - echo
steps:
  - name: echo-hello
    capability: echo
    input:
      message: hello from workflow
  - name: echo-world
    capability: echo
    input:
      message: world
