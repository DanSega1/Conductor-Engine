name: CI

on:
  pull_request:
    paths:
      - "engine/**"
      - "cli/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-test.txt"
      - "ruff.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
    paths:
      - "engine/**"
      - "cli/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-test.txt"
      - "ruff.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  commit-check:
    name: Conventional Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${HEAD_SHA}^!"
          else
            RANGE="${BEFORE_SHA}..${HEAD_SHA}"
          fi

          export RANGE

          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          range_spec = os.environ["RANGE"]
          pattern = re.compile(
              r"^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)"
              r"(\([A-Za-z0-9._/-]+\))?!?: .+"
          )

          messages = subprocess.check_output(
              ["git", "log", "--format=%s", range_spec],
              text=True,
          ).splitlines()

          invalid = [
              message
              for message in messages
              if message
              and not pattern.match(message)
              and not message.startswith("Merge ")
              and not message.startswith("Revert ")
          ]

          if invalid:
              print("The following commit messages are not Conventional Commits:", file=sys.stderr)
              for message in invalid:
                  print(f"  - {message}", file=sys.stderr)
              sys.exit(1)
          PY

  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    needs: commit-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-test.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run engine tests
        run: pytest tests/engine -q
