# Ruff configuration for Conductor-Engine
# https://docs.astral.sh/ruff/configuration/

target-version = "py312"
line-length = 100

src = [
    "cli",
    "engine",
    "tests",
]

exclude = [
    ".git",
    ".github",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]

ignore = [
    "E501", # line too long, handled by formatter
]

[lint.isort]
known-first-party = ["cli", "engine"]
force-sort-within-sections = true

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
